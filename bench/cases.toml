# Benchmark cases for golly_bench.py.
#
# name      unique case name (prefix = algorithm: ql, hl, gen, ltl, jvn, rl, super)
# pattern   path relative to the repo root
# algo      algorithm name as shown in Golly's Control > Set Algorithm menu
# base/expo step size: each step advances base^expo generations (Golly's step setting)
# steps     number of steps; the run stops at generation steps * base^expo (bgolly -m, golly --bench gen=)
# groups    which case groups include the case ("full" contains every case)
# fixed_step  true: not calibrated; the step and steps are set by hand
#
# HashLife and QuickLife cases: 100 steps each; the step is 2^expo, chosen by
# `golly_bench.py calibrate` with the original code (see README.md, Cases).
# Calibrated 2026-10-07 on an Intel i9-12900HX laptop (host conformal) with
# bgolly built from upstream commit dcbc0873.

# ---- QuickLife ---------------------------------------------------------------

[[case]]
name = "ql-cambrian-explosion"      # chaotic growth to ~83M cells, active everywhere
pattern = "Patterns/Life/Miscellaneous/cambrian-explosion.rle"
algo = "QuickLife"
base = 2
expo = 8
steps = 100
groups = ["quick", "full"]

[[case]]
name = "ql-oscillator-stamps"       # 240k cells of oscillators; no growth, no quiet regions
pattern = "Patterns/Life/Oscillators/oscillator-stamp-collection-31January2023.rle"
algo = "QuickLife"
base = 2
expo = 8
steps = 100
groups = ["quick", "full"]

[[case]]
name = "ql-switch-engine-breeder"   # quadratic growth, mostly still debris
pattern = "Patterns/Life/Breeders/switch-engine-breeder.rle"
algo = "QuickLife"
base = 2
expo = 10
steps = 100
groups = ["quick", "full"]

[[case]]
name = "ql-spacefiller"             # ~650M cells of periodic agar at the end (QuickLife skips most of it)
pattern = "Patterns/Life/Breeders/spacefiller.rle"
algo = "QuickLife"
base = 2
expo = 9
steps = 100
groups = ["quick", "full"]

[[case]]
name = "ql-lfod-rule110"            # Life-like rule (not B3/S23)
pattern = "Patterns/Life-Like/lfod-flying-rule110-simulator.rle"
