base = 2
expo = 0
steps = 3000
fixed_step = true                   # bounded grid: bgolly only steps it 1 generation at a time
groups = ["quick", "full"]

[[case]]
name = "ql-nontotalistic-bubbles"   # isotropic non-totalistic rule
